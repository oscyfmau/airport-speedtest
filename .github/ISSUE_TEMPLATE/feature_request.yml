name: 功能建议
description: 想要什么新功能
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: 使用场景
      description: 描述你想解决什么问题（现在的痛点是什么）
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的样子
      description: 希望这个功能怎么用、结果显示在哪里（报告/控制台/菜单）
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 现在是怎么绕过的？有没有同类工具的做法可以参考
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 这是通用功能建议（不是要支持某个特定机场/节点的特殊配置）
