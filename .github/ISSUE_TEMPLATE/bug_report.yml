name: Bug 报告
description: 运行报错或结果异常，请填写此表单
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: 版本号
      description: 运行 `python core/speed_test.py -h` 可看到版本号
      placeholder: 如 v4.9.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: 如 Windows 11 64 位
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python 版本
      description: 命令 `python --version` 查看
      placeholder: 如 3.13.5
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 怎么操作的？（双击 run.bat 还是命令行？选的菜单几？）
      placeholder: |
        1. 双击 run.bat
        2. 菜单选 2 标准测试
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望与实际结果
      description: 期望发生什么？实际发生了什么？（报错内容、截图、报告异常之处）
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志文件（重要）
      description: 打开 log/ 文件夹里最新的 测速日志_*.jsonl，把内容粘贴到这里（或直接上传该文件）。里面有运行环境、每一步操作、每个节点的明细和报错堆栈，没有它很难定位问题。
      render: json
  - type: textarea
    id: extra
    attributes:
      label: 其他信息
      description: 涉及哪个协议类型（vmess/vless/...）？是否所有节点都异常？
      placeholder: 订阅链接请勿粘贴（含敏感 token），只需描述现象即可
